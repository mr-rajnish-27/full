{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">
Login
</h2>
{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}
<form method="post">

{% csrf_token %}

<input type="text"
name="username"
placeholder="Username"
class="form-control mb-3">

<input type="password"
name="password"
placeholder="Password"
class="form-control mb-3">

<button type="submit"
class="btn btn-dark w-100">

Login

</button>

</form>

<p class="text-center mt-3">

Don't have account?

<a href="/register/">

Register

</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
